# Render with scripts/render_cloudrun.py or deploy/deploy.ps1 before applying.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __SERVICE__
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: __SERVICE_ACCOUNT__
      containerConcurrency: 10
      timeoutSeconds: 3600
      containers:
        - image: __IMAGE__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: GOOGLE_CLOUD_PROJECT
              value: __PROJECT__
            - name: GOOGLE_CLOUD_LOCATION
              value: __GEMINI_LOCATION__
            - name: ALLOWED_ORIGINS
              value: __ORIGIN__
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __SECRET__
                  key: __SECRET_VERSION__
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
