<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menstrual pad assistant</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
<main>
  <h1 id="title">Menstrual pad assistant</h1>
  <p id="intro">Show your menstrual pads or packaging. Choose camera guidance or check the brand and features.</p>
  <section class="card">
    <label for="language">Language / &#35486;&#35328;</label>
    <select id="language"><option value="en">English</option><option value="zh-TW">&#32321;&#39636;&#20013;&#25991;</option></select>
    <div class="controls framing-controls">
      <button id="guide" class="primary">Start camera guidance</button>
      <button id="analyze">Look at the brand</button>
    </div>
    <p id="status" role="status">Choose a button to start.</p>
    <div class="viewfinder">
      <video id="preview" autoplay muted playsinline></video>
      <div class="crosshair" aria-hidden="true"></div>
      <button id="capture" class="shutter" disabled>Take photo</button>
    </div>
    <a id="download" hidden>Download photo</a>
    <img id="photo" hidden alt="Captured menstrual pads">
    <p id="result" role="status" aria-live="polite"></p>
    <p id="note" class="small">Allow camera access when asked. Replies are spoken and shown here. Brand details depend on readable packaging.</p>
  </section>
</main>
</body>
</html>
